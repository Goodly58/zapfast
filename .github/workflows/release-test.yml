name: release-test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.20.1
    steps:
      - run: |
          {
            echo "Patched build of [ZapFast $TAG](https://github.com/crmne/zapfast/releases/tag/$TAG) for Windows x64."
            echo
            gh release view "$TAG" --repo crmne/zapfast --json body --jq .body \
              | grep -v -e '^\*\*Download ZapFast:\*\*' -e '^On a Mac'
          } > notes.md
          wc -c notes.md
          GH_DEBUG=api gh release create test-e --repo "$GITHUB_REPOSITORY" --title "test e" --notes-file notes.md --target "$GITHUB_SHA" 2>&1 | grep -E "^< HTTP|message" | head -4; echo "E done (upstream notes)"
          sed -E 's/@([A-Za-z0-9-]+)/\1/g' notes.md > notes-nomention.md
          GH_DEBUG=api gh release create test-f --repo "$GITHUB_REPOSITORY" --title "test f" --notes-file notes-nomention.md --target "$GITHUB_SHA" 2>&1 | grep -E "^< HTTP|message" | head -4; echo "F done (no @mentions)"
